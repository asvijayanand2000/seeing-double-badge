<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Seeing Double badge · TechCon 2026</title>
<style>
  :root { --bg:#0A0E1A; --panel:#141B2E; --line:#2A3558; --text:#F4F6FB; --dim:#A3ADCB; --ai:#3BE0FF; --ai2:#7C6CFF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--dim); margin: 0 0 14px; }
  canvas { width: 100%; height: auto; border-radius: 12px; display:block; background:#ddd; }
  label { display:block; font-weight:700; margin:16px 0 6px; color:var(--dim); font-size:13px; letter-spacing:1px; text-transform:uppercase; }
  input, textarea { width:100%; background:var(--panel); color:var(--text); border:1.5px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height: 170px; resize: vertical; }
  .buttons { display:grid; gap:10px; margin-top:16px; }
  button { font:inherit; font-weight:800; border:0; border-radius:12px; padding:15px; cursor:pointer; }
  .primary { background:linear-gradient(90deg,var(--ai),var(--ai2)); color:var(--bg); font-size:17px; }
  .secondary { background:var(--panel); color:var(--text); border:1.5px solid var(--line); }
  .toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#2EE59D; color:#0A0E1A; font-weight:800; padding:12px 18px; border-radius:12px; opacity:0; transition:opacity .2s; max-width:92vw; text-align:center; }
  .toast.show { opacity:1; }
  .help { color:var(--dim); font-size:14px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>Your TechCon 2026 badge</h1>
  <p class="sub">Seeing Double · AI-First Quality Engineering booth</p>
  <canvas id="badge" width="760" height="760" aria-label="Your badge"></canvas>

  <label for="name">Your name on the badge</label>
  <input id="name" maxlength="20" autocomplete="off" placeholder="Type your name">

  <label for="post">Your LinkedIn post (edit if you like)</label>
  <textarea id="post"></textarea>

  <div class="buttons">
    <button class="primary" id="share">Share to LinkedIn</button>
    <button class="secondary" id="save">Save badge image</button>
    <button class="secondary" id="copy">Copy post text</button>
  </div>
  <p class="help">On LinkedIn: start a post, add your badge image, then paste the text. We copy the text for you.</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script id="logic">
// ---- pure logic (unit-tested) ----------------------------------------
var BADGE = { w: 760, h: 760, left: 230, baseline: 507, maxWidth: 360, size: 34, minSize: 18, color: '#101A3A' };
var MAX_NAME = 20;
// Approved by Vijay (verbatim). Edit here, then run tool/build_badge_page.py.
var POST_TEXT =
  'My takeaways from the AI-First Quality Engineering booth at Citi - TechCon 2026:\n' +
  '\u2705 AI skills for static testing catch issues before the code even runs\n' +
  '\u2705 Test coverage gap analysis shows exactly which tests are missing\n' +
  '\u2705 Devin turns those gaps into automated tests\n' +
  'The result: quality shifts left in the SDLC, and we release faster with confidence. Proud to be an AI-Empowered Quality Champion \uD83C\uDFC5\n' +
  '#TechCon2026 #ShiftLeft #QualityEngineering #Citi #AI';

function cleanName(raw) {
  var s = String(raw == null ? '' : raw).normalize('NFC');
  s = s.replace(/[^\p{L}\p{M}\p{N} .'\-]/gu, '');   // letters (any language), digits, space . ' -
  s = s.replace(/\s+/g, ' ').trim();
  return Array.from(s).slice(0, MAX_NAME).join('').trim();
}
function postText() { return POST_TEXT; }
function badgeLabel(name) { return name.toUpperCase(); }     // just the name
// Left edge for a name of the given width, centred in the name area (same rule as the app).
function nameX(width) { return BADGE.left + (BADGE.maxWidth - width) / 2; }
// Largest font size (template px) that fits the ribbon. measure(sizePx) -> width.
function fitSize(measure) {
  var s = BADGE.size;
  while (s > BADGE.minSize && measure(s) > BADGE.maxWidth) s--;
  return s;
}
function fileNameFor(name) {
  var safe = cleanName(name).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return 'techcon2026-badge' + (safe ? '-' + safe : '') + '.png';
}
if (typeof module !== 'undefined') module.exports = { cleanName: cleanName, postText: postText, badgeLabel: badgeLabel, nameX: nameX, fitSize: fitSize, fileNameFor: fileNameFor, BADGE: BADGE };
</script>

  var canvas = document.getElementById('badge');
  var ctx = canvas.getContext('2d');
  var nameInput = document.getElementById('name');
  var post = document.getElementById('post');
  var img = new Image();
  var ready = false;

  var params = new URLSearchParams(location.search);
  nameInput.value = cleanName(params.get('n'));
  post.value = postText();

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;          // text only: never treated as HTML
    t.className = 'toast show';
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  function draw() {
    if (!ready) return;
    var name = cleanName(nameInput.value);
    ctx.clearRect(0, 0, BADGE.w, BADGE.h);
    ctx.drawImage(img, 0, 0, BADGE.w, BADGE.h);
    var label = badgeLabel(name);
    var size = fitSize(function (s) { ctx.font = '700 ' + s + 'px BadgeRoboto'; return ctx.measureText(label).width; });
    ctx.font = '700 ' + size + 'px BadgeRoboto';
    ctx.fillStyle = BADGE.color;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, nameX(ctx.measureText(label).width), BADGE.baseline);
    document.body.setAttribute('data-drawn', label + '|' + size);
  }

  function badgeBlob() {
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/png'); });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    post.focus(); post.select();
    try { return document.execCommand('copy'); } catch (e) { return false; }
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  document.getElementById('save').addEventListener('click', function () {
    badgeBlob().then(function (b) { download(b, fileNameFor(nameInput.value)); toast('Badge saved'); });
  });

  document.getElementById('copy').addEventListener('click', function () {
    copyText(post.value).then(function (ok) { toast(ok ? 'Post text copied' : 'Select the text and copy it'); });
  });

  document.getElementById('share').addEventListener('click', function () {
    var text = post.value;
    copyText(text).then(function () {
      return badgeBlob();
    }).then(function (b) {
      var file = new File([b], fileNameFor(nameInput.value), { type: 'image/png' });

        return navigator.share({ files: [file], text: text, title: 'My TechCon 2026 badge' }).catch(function () {});

      window.open('https://www.linkedin.com/feed/?shareActive=true', '_blank', 'noopener');

  Promise.all([
